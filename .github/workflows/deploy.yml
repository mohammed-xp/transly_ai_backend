name: Build and deploy API

on:
  push:
    branches: [main]
    paths:
      - "TranslyAI.Api/**"
      - ".github/workflows/deploy.yml"
  
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/mohammed-xp/translyai-api
  RESOURCE_GROUP: transly-rg
  CONTAINER_APP: translyai-api


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and push image with the .NET SDK
        run: >
          dotnet publish TranslyAI.Api/TranslyAI.Api.csproj
          -c Release
          --os linux
          --arch x64
          -t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerImageTags='"latest;${{ github.sha }}"'

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy the new image to Container Apps
        run: |
          az containerapp update \
          --name ${{ env.CONTAINER_APP }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.IMAGE_NAME }}:${{ github.sha }}